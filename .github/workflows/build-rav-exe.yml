# Builds "ספר מהרב" as a Windows app (Rav.exe, no Python needed) on every change to it,
# and puts it on the release "rav-exe": .../releases/download/rav-exe/Rav-windows.zip
name: build rav exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rav-python/**"
      - ".github/workflows/build-rav-exe.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r rav-python/requirements.txt pyinstaller

      - name: Build
        working-directory: rav-python
        run: >
          pyinstaller --noconfirm --windowed --name Rav
          --collect-all faster_whisper --collect-all ctranslate2 --collect-data yt_dlp
          --hidden-import PySide6.QtPrintSupport
          --exclude-module tkinter
          main.py

      - name: Smoke test (the exe starts, the window opens, a step in the background comes back, a small book comes out)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force st | Out-Null
          $p = Start-Process -FilePath "rav-python/dist/Rav/Rav.exe" -ArgumentList "--selftest", "$PWD\st" -Wait -PassThru
          Get-Content rav-python/dist/Rav/rav.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "the exe failed (exit $($p.ExitCode))" }
          if (!(Test-Path st/selftest.pdf) -or !(Test-Path st/selftest.docx)) { throw "the exe did not make the test book" }
          Get-Content st/selftest.txt
          if ((Get-Content st/selftest.txt) -notmatch "audio=16000") { throw "the exe could not open a recording for transcribing" }

      - name: The browser inside Rav.exe reads a page built by its scripts
        # (the yeshiva site itself now asks servers to verify a human, so a page of our own is used)
        shell: pwsh
        run: |
          $html = '<html><body><div id=app>loading</div><script>setTimeout(function(){document.getElementById("app").innerHTML="<article>" + "שיעור לחנוכה, נר איש וביתו. ".repeat(60) + "</article>"},1500)</script></body></html>'
          Set-Content -Path st/page.html -Value $html -Encoding utf8
          $url = "file:///" + ((Resolve-Path st/page.html).Path -replace '\\','/')
          $p = Start-Process -FilePath "rav-python/dist/Rav/Rav.exe" -ArgumentList "--render", $url, "$PWD\st\render.txt" -Wait -PassThru
          Get-Content st/render.txt
          Get-Content rav-python/dist/Rav/rav.log -ErrorAction SilentlyContinue
          $first = Get-Content st/render.txt -TotalCount 1
          if ($first -notmatch "builtin=True") { throw "the browser inside Rav.exe did not start" }
          if ($first -notmatch "text=([0-9]{4,})") { throw "the browser inside Rav.exe did not read the page" }

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item rav-python/README.md rav-python/dist/Rav/
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("rav-python/dist/Rav", "Rav-windows.zip", [System.IO.Compression.CompressionLevel]::Optimal, $true, [System.Text.Encoding]::UTF8)

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view rav-exe >/dev/null 2>&1 || gh release create rav-exe --title "ספר מהרב לווינדוס" --notes "Rav-windows.zip: מחלצים ומפעילים את Rav.exe. צריך גם Claude Code מחובר לחשבון Claude (ראו README)."
          # the version goes up with the zip, so that "עדכון תוכנה" in the program sees it only when the zip is there
          python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('rav-python/rav/version.py', encoding='utf-8').read()).group(1))" > rav-version.txt
          cat rav-version.txt
          gh release upload rav-exe Rav-windows.zip rav-version.txt --clobber
