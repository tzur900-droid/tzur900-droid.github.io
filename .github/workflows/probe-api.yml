# Temporary diagnostics
name: probe api
on:
  push:
    branches: [claude/gallant-dirac-hfllm5]
    paths: ["tools/probe_api.py", ".github/workflows/probe-api.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/probe_api.py
