# Temporary diagnostics
name: probe api
on:
  push:
    branches: [claude/gallant-dirac-hfllm5]
    paths: ["tools/probe_api.py", ".github/workflows/probe-api.yml"]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - env:
          PYTHONIOENCODING: utf-8
        run: python tools/probe_api.py
