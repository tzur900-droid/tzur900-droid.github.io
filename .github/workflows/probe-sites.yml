# Temporary diagnostics: how the lesson sites answer from Windows (direct and through Edge).
name: probe sites
on:
  push:
    branches: [claude/gallant-dirac-hfllm5]
    paths: ["tools/probe_sites.py", ".github/workflows/probe-sites.yml", "rav-python/rav/collect.py"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 pypdf
      - name: Probe
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/probe_sites.py
